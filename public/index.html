<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>watch-alert</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111; --sub: #8a8a8a; --line: #ededed; --card: #fafafa;
    --accent: #111; --up: #e5484d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--fg); word-break: keep-all;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; background: rgba(255,255,255,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line); z-index: 5; padding: env(safe-area-inset-top) 0 0; }
  .hwrap { max-width: 1000px; margin: 0 auto; padding: 14px 16px 10px; }
  h1 { margin: 0; font-size: 1.15rem; font-weight: 700; letter-spacing: -.02em; }
  .meta { color: var(--sub); font-size: .74rem; margin-top: 3px; }
  .controls { display: flex; gap: 8px; align-items: center; margin-top: 12px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .chip { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 999px;
    padding: 6px 13px; font-size: .82rem; cursor: pointer; color: var(--fg); white-space: nowrap; }
  .chip.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  select { margin-left: auto; flex: none; font-size: .82rem; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; background: #fff; }
  main { max-width: 1000px; margin: 0 auto; padding: 14px 16px 60px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px 12px; }
  .card { display: flex; flex-direction: column; text-decoration: none; color: inherit; }
  .ph { position: relative; width: 100%; aspect-ratio: 1/1; background: var(--card);
    border-radius: 12px; overflow: hidden; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .badge { position: absolute; left: 7px; top: 7px; background: rgba(0,0,0,.72); color: #fff;
    font-size: .66rem; padding: 3px 7px; border-radius: 999px; letter-spacing: -.01em; }
  .new { position: absolute; right: 7px; top: 7px; background: var(--up); color: #fff;
    font-size: .64rem; font-weight: 700; padding: 3px 7px; border-radius: 999px; }
  .title { font-size: .82rem; line-height: 1.34; margin: 8px 2px 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .price { font-size: .92rem; font-weight: 700; margin: 4px 2px 0; font-variant-numeric: tabular-nums; }
  .price .ask { font-weight: 500; color: var(--sub); font-size: .82rem; }
  .price .age { font-weight: 400; color: var(--sub); font-size: .74rem; }
  .empty { color: var(--sub); text-align: center; padding: 60px 0; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 16px 10px; } }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <h1>watch-alert</h1>
    <div class="meta" id="meta">불러오는 중…</div>
    <div class="controls" id="controls"></div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">매물이 없습니다.</div>
</main>
<script>
  const SITE_ORDER = ["시계거래소","바이버","번개장터","중고나라","캉카스","필웨이","타임포럼"];
  let all = [], site = "전체", sort = "new";
  const won = (n) => n ? (n >= 10000 ? Math.round(n/10000).toLocaleString()+"만원" : n.toLocaleString()+"원") : null;
  const toMs = (v) => v == null ? null : (typeof v === "number" ? (v < 1e12 ? v*1000 : v) : Date.parse(String(v).replace(" ","T")) || null);
  function ageLabel(v) {
    const ms = toMs(v); if (!ms) return "";
    const d = Math.floor((Date.now() - ms) / 86400000);
    if (d <= 0) return "오늘"; if (d === 1) return "어제"; return d + "일 전";
  }

  function render() {
    const grid = document.getElementById("grid");
    let list = site === "전체" ? all : all.filter(i => i.site === site);
    if (sort === "priceUp") list = [...list].sort((a,b)=>(a.price||1e15)-(b.price||1e15));
    else if (sort === "priceDown") list = [...list].sort((a,b)=>(b.price||0)-(a.price||0));
    else if (sort === "new") list = [...list].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0) || (toMs(b.date)||0)-(toMs(a.date)||0));
    else list = [...list].sort((a,b)=>SITE_ORDER.indexOf(a.site)-SITE_ORDER.indexOf(b.site));

    document.getElementById("empty").style.display = list.length ? "none" : "block";
    grid.innerHTML = list.map(i => `
      <a class="card" href="${i.url}" target="_blank" rel="noopener">
        <div class="ph">
          ${i.image ? `<img loading="lazy" src="${i.image}" alt="" onerror="this.style.display='none'">` : ""}
          <span class="badge">${i.site}</span>
          ${i.isNew ? `<span class="new">🆕 NEW</span>` : ""}
        </div>
        <div class="title">${i.title}</div>
        <div class="price">${i.price ? won(i.price) : '<span class="ask">가격문의</span>'}${i.date ? `<span class="age"> · ${ageLabel(i.date)}</span>` : ''}</div>
      </a>`).join("");
  }

  function buildControls() {
    const counts = {}; all.forEach(i => counts[i.site] = (counts[i.site]||0)+1);
    const sites = ["전체", ...SITE_ORDER.filter(s => counts[s])];
    const c = document.getElementById("controls");
    c.innerHTML = sites.map(s =>
      `<span class="chip${s===site?' on':''}" data-s="${s}">${s}${s!=="전체"?` ${counts[s]}`:` ${all.length}`}</span>`
    ).join("") +
    `<select id="sort">
       <option value="new">최신순</option>
       <option value="site">사이트순</option>
       <option value="priceUp">가격 낮은순</option>
       <option value="priceDown">가격 높은순</option>
     </select>`;
    c.querySelectorAll(".chip").forEach(el => el.onclick = () => { site = el.dataset.s; buildControls(); render(); });
    document.getElementById("sort").value = sort;
    document.getElementById("sort").onchange = (e) => { sort = e.target.value; render(); };
  }

  fetch("./snapshot.json?" + Date.now()).then(r => r.json()).then(d => {
    all = d.items || [];
    const t = new Date(d.updatedAt);
    const ago = t.toLocaleString("ko-KR", { month:"numeric", day:"numeric", hour:"2-digit", minute:"2-digit" });
    document.getElementById("meta").textContent =
      `${(d.keywords||[]).join(", ")} · ${all.length}건 · ${ago} 기준`;
    buildControls(); render();
  }).catch(() => { document.getElementById("meta").textContent = "snapshot.json 을 불러오지 못했습니다."; });
</script>
</body>
</html>
