<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>watch-alert</title>
<style>
  :root {
    --bg:#fff; --fg:#111; --sub:#8a8a8a; --line:#ededed; --card:#fafafa; --accent:#111; --up:#e5484d;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); word-break:keep-all;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
  header { position:sticky; top:0; background:rgba(255,255,255,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line); z-index:5; padding:env(safe-area-inset-top) 0 0; }
  .hwrap { max-width:1000px; margin:0 auto; padding:13px 16px 9px; }
  .toprow { display:flex; align-items:baseline; gap:8px; }
  h1 { margin:0; font-size:1.15rem; font-weight:700; letter-spacing:-.02em; }
  .meta { color:var(--sub); font-size:.73rem; }
  .info { color:var(--sub); font-size:.73rem; margin-top:5px; line-height:1.5; }
  .info b { color:var(--fg); font-weight:600; }
  .gear { margin-left:auto; border:1px solid var(--line); background:#fff; border-radius:8px;
    font-size:.8rem; padding:5px 10px; cursor:pointer; }
  .row { display:flex; gap:7px; align-items:center; margin-top:10px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .row .lbl { flex:none; font-size:.7rem; color:var(--sub); }
  .chip { flex:none; border:1px solid var(--line); background:#fff; border-radius:999px;
    padding:5px 12px; font-size:.8rem; cursor:pointer; color:var(--fg); white-space:nowrap; }
  .chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .chip.kw.on { background:#1e6fd9; border-color:#1e6fd9; }
  select { flex:none; font-size:.8rem; border:1px solid var(--line); border-radius:8px; padding:5px 8px; background:#fff; }
  main { max-width:1000px; margin:0 auto; padding:12px 16px 60px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px 12px; }
  .card { display:flex; flex-direction:column; text-decoration:none; color:inherit; }
  .ph { position:relative; width:100%; aspect-ratio:1/1; background:var(--card); border-radius:12px; overflow:hidden; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .badge { position:absolute; left:7px; top:7px; background:rgba(0,0,0,.72); color:#fff;
    font-size:.66rem; padding:3px 7px; border-radius:999px; }
  .new { position:absolute; right:7px; top:7px; background:var(--up); color:#fff;
    font-size:.64rem; font-weight:700; padding:3px 7px; border-radius:999px; }
  .title { font-size:.82rem; line-height:1.34; margin:8px 2px 0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kwtag { font-size:.68rem; color:#1e6fd9; margin:5px 2px 0; }
  .price { font-size:.92rem; font-weight:700; margin:2px 2px 0; font-variant-numeric:tabular-nums; }
  .price .ask { font-weight:500; color:var(--sub); font-size:.82rem; }
  .price .age { font-weight:400; color:var(--sub); font-size:.74rem; }
  .empty { color:var(--sub); text-align:center; padding:60px 0; }
  .section-h { font-size:.95rem; font-weight:700; margin:26px 2px 12px; padding-top:16px; border-top:1px solid var(--line); }
  .section-h .sub { font-weight:500; color:var(--sub); font-size:.8rem; }
  .price-inputs { display:flex; align-items:center; gap:6px; margin-bottom:14px; }
  .price-inputs input { width:90px; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:7px; }
  .price-inputs span { color:var(--sub); font-size:.85rem; }
  /* 편집 패널 */
  .panel { display:none; border-top:1px solid var(--line); margin-top:10px; padding-top:12px; }
  .panel.open { display:block; }
  .panel h3 { font-size:.78rem; color:var(--sub); margin:0 0 7px; font-weight:600; }
  .edit-list { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:8px; }
  .edit-chip { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:999px; padding:5px 8px 5px 12px; font-size:.82rem; }
  .edit-chip button { border:none; background:none; color:var(--sub); cursor:pointer; font-size:1rem; line-height:1; padding:0; }
  .addbar { display:flex; gap:7px; margin-bottom:14px; }
  .addbar input { flex:1; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  .addbar button, .saveBtn { border:none; background:var(--accent); color:#fff; border-radius:8px; padding:9px 14px; font-size:.85rem; cursor:pointer; }
  .times input { width:70px; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:7px; margin-right:6px; }
  .savenote { font-size:.72rem; color:var(--sub); margin-top:8px; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="toprow">
      <h1>watch-alert</h1>
      <span class="meta" id="meta">불러오는 중…</span>
      <button class="gear" id="gear" style="display:none" onclick="togglePanel()">⚙️ 편집</button>
    </div>
    <div class="meta" id="updated" style="margin-top:3px;font-weight:600;color:var(--fg)"></div>
    <div class="info" id="info"></div>
    <div class="row" id="kwrow"></div>
    <div class="row" id="siterow"></div>
    <div class="panel" id="panel">
      <h3>검색어 (여러 개 추가 가능 · 저장 시 클라우드에도 반영)</h3>
      <div class="edit-list" id="kwEdit"></div>
      <div class="addbar">
        <input id="kwInput" placeholder="검색어 추가 (예: 롤렉스 서브마리너)">
        <button onclick="addKw()">추가</button>
      </div>
      <h3>금액 범위 (만원 · 0 = 제한 없음)</h3>
      <div class="price-inputs">
        <input type="number" id="pMin" placeholder="최소" min="0"><span>만원 ~</span>
        <input type="number" id="pMax" placeholder="최대" min="0"><span>만원</span>
      </div>
      <h3>알림 기준 (며칠 이내 등록된 새 매물만 알림 · 0=제한없음)</h3>
      <div class="price-inputs"><input type="number" id="aAge" min="0"><span>일 이내</span></div>
      <h3>검색 시각 (하루 3회 · 시각 변경은 맥에서만 적용됨)</h3>
      <div class="times" id="timesEdit"></div>
      <div style="margin-top:12px"><button class="saveBtn" onclick="save()">💾 저장하고 적용</button>
        <span class="savenote" id="saveNote"></span></div>
      <div class="savenote" id="patHelp" style="display:none;margin-top:10px;line-height:1.6"></div>
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">매물이 없습니다.</div>
  <div id="askSection" style="display:none">
    <div class="section-h">💬 가격문의 <span id="askCount" class="sub"></span></div>
    <div class="grid" id="askGrid"></div>
  </div>
</main>
<script>
  const SITE_ORDER = ["시계거래소","바이버","번개장터","중고나라","캉카스","필웨이","타임포럼","구구스"];
  let all=[], site="전체", sort="new", kwActive=new Set(), settings={keywords:[],times:[],priceMin:0,priceMax:0,alertMaxAgeDays:0}, hasLocalApi=false;
  const cardHtml = (i) => `
    <a class="card" href="${i.url}" target="_blank" rel="noopener">
      <div class="ph">
        ${i.image?`<img loading="lazy" src="${i.image}" alt="" onerror="this.style.display='none'">`:""}
        <span class="badge">${i.site}</span>
        ${i.isNew?`<span class="new">🆕 NEW</span>`:""}
      </div>
      <div class="title">${i.title}</div>
      ${i.keyword?`<div class="kwtag">🔍 ${i.keyword}</div>`:""}
      <div class="price">${i.price?won(i.price):'<span class="ask">가격문의</span>'}${i.date?`<span class="age"> · ${ageLabel(i.date)}</span>`:""}</div>
    </a>`;
  const won = (n) => n ? (n>=10000 ? Math.round(n/10000).toLocaleString()+"만원" : n.toLocaleString()+"원") : null;
  const toMs = (v) => v==null ? null : (typeof v==="number" ? (v<1e12?v*1000:v) : Date.parse(String(v).replace(" ","T"))||null);
  function ageLabel(v){ const ms=toMs(v); if(!ms) return ""; const d=Math.floor((Date.now()-ms)/86400000);
    return d<=0?"오늘":d===1?"어제":d+"일 전"; }

  function render() {
    let list = site==="전체" ? all : all.filter(i=>i.site===site);
    if (kwActive.size) list = list.filter(i => kwActive.has(i.keyword));
    // 가격문의(가격 없음)는 따로 분리
    let priced = list.filter(i=>i.price);
    const asks = list.filter(i=>!i.price);
    // 금액 범위 필터(만원 → 원). max=0 이면 상한 없음
    const min=(settings.priceMin||0)*10000, max=(settings.priceMax||0)*10000;
    if (min>0 || max>0) priced = priced.filter(i=>i.price>=min && (max===0 || i.price<=max));

    const sortFn = (arr)=>{
      if (sort==="priceUp") return [...arr].sort((a,b)=>a.price-b.price);
      if (sort==="priceDown") return [...arr].sort((a,b)=>b.price-a.price);
      if (sort==="new") return [...arr].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0) || (toMs(b.date)||0)-(toMs(a.date)||0));
      return [...arr].sort((a,b)=>SITE_ORDER.indexOf(a.site)-SITE_ORDER.indexOf(b.site));
    };
    document.getElementById("empty").style.display = (priced.length||asks.length)?"none":"block";
    document.getElementById("grid").innerHTML = sortFn(priced).map(cardHtml).join("");
    document.getElementById("askSection").style.display = asks.length?"block":"none";
    document.getElementById("askCount").textContent = asks.length?`${asks.length}건`:"";
    document.getElementById("askGrid").innerHTML = sortFn(asks).map(cardHtml).join("");
  }

  function buildFilters() {
    const counts={}; all.forEach(i=>counts[i.site]=(counts[i.site]||0)+1);
    const sites=["전체",...SITE_ORDER.filter(s=>counts[s])];
    document.getElementById("siterow").innerHTML =
      `<span class="lbl">사이트</span>` +
      sites.map(s=>`<span class="chip site${s===site?' on':''}" data-s="${s}">${s}${s!=="전체"?` ${counts[s]}`:` ${all.length}`}</span>`).join("") +
      `<select id="sort">
         <option value="new">최신순</option><option value="site">사이트순</option>
         <option value="priceUp">가격↑</option><option value="priceDown">가격↓</option>
       </select>`;
    document.querySelectorAll(".chip.site").forEach(el=>el.onclick=()=>{site=el.dataset.s;buildFilters();render();});
    document.getElementById("sort").value=sort;
    document.getElementById("sort").onchange=e=>{sort=e.target.value;render();};

    // 키워드 필터(여러 개 선택 가능)
    const kc={}; all.forEach(i=>i.keyword&&(kc[i.keyword]=(kc[i.keyword]||0)+1));
    const kws=Object.keys(kc);
    document.getElementById("kwrow").innerHTML = kws.length>1 || kwActive.size ?
      `<span class="lbl">검색어</span>` +
      kws.map(k=>`<span class="chip kw${kwActive.has(k)?' on':''}" data-k="${k}">${k} ${kc[k]}</span>`).join("") : "";
    document.querySelectorAll(".chip.kw").forEach(el=>el.onclick=()=>{
      const k=el.dataset.k; kwActive.has(k)?kwActive.delete(k):kwActive.add(k); buildFilters(); render();
    });
  }

  // ===== 편집 패널 =====
  function togglePanel(){ document.getElementById("panel").classList.toggle("open"); renderPanel(); }
  function renderPanel(){
    document.getElementById("kwEdit").innerHTML = settings.keywords.map((k,idx)=>
      `<span class="edit-chip">${k}<button onclick="delKw(${idx})">×</button></span>`).join("") || '<span class="savenote">검색어가 없습니다</span>';
    document.getElementById("timesEdit").innerHTML = (settings.times||[]).map((t,idx)=>
      `<input type="time" value="${t}" onchange="settings.times[${idx}]=this.value">`).join("");
    document.getElementById("pMin").value = settings.priceMin||"";
    document.getElementById("pMax").value = settings.priceMax||"";
    document.getElementById("pMin").onchange = e=>settings.priceMin=Number(e.target.value)||0;
    document.getElementById("pMax").onchange = e=>settings.priceMax=Number(e.target.value)||0;
    const aa=document.getElementById("aAge"); aa.value=settings.alertMaxAgeDays||""; aa.onchange=e=>settings.alertMaxAgeDays=Number(e.target.value)||0;
    // 폰(로컬서버 없음)이면 GitHub 토큰 안내 표시
    const ph=document.getElementById("patHelp");
    if(!hasLocalApi && !localStorage.getItem("gh_pat")){
      ph.style.display="block";
      ph.innerHTML="📱 폰에서 저장하려면 GitHub 토큰이 한 번 필요합니다:<br>"+
        "1) <a href='https://github.com/settings/tokens/new?scopes=repo&description=watch-alert' target='_blank'>여기서 토큰 생성</a> (repo 권한, 만료 no expiration)<br>"+
        "2) 생성된 토큰 복사 → 저장 누르면 입력창에 붙여넣기 (폰에 1회 저장됨)";
    } else ph.style.display="none";
  }
  function addKw(){ const v=document.getElementById("kwInput").value.trim(); if(!v)return;
    if(!settings.keywords.includes(v))settings.keywords.push(v); document.getElementById("kwInput").value=""; renderPanel(); }
  function delKw(i){ settings.keywords.splice(i,1); renderPanel(); }
  const REPO="chanbap24-create/watch-alert";
  async function save(){
    const note=document.getElementById("saveNote"); note.textContent="저장 중…";
    // 1) 맥 로컬 서버가 있으면 그쪽으로(스케줄까지 갱신)
    if (hasLocalApi){
      try{
        const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(settings)});
        const j=await r.json();
        note.textContent = j.ok ? "✅ 저장됨. 다음 검색부터 적용" + (j.pushed?" (클라우드 반영)":"") : "저장 실패: "+(j.error||"");
        return;
      }catch(e){}
    }
    // 2) 폰/외부: GitHub에 직접 커밋(토큰 필요)
    let pat=localStorage.getItem("gh_pat");
    if(!pat){ pat=prompt("GitHub 토큰을 입력하세요 (한 번만). 만드는 법은 아래 안내 참고:"); if(!pat){note.textContent="취소됨";return;} localStorage.setItem("gh_pat",pat.trim()); }
    try{
      const url=`https://api.github.com/repos/${REPO}/contents/settings.json`;
      const cur=await fetch(url,{headers:{Authorization:"token "+pat}}).then(r=>r.json());
      const body={keywords:settings.keywords,times:settings.times,priceMin:settings.priceMin||0,priceMax:settings.priceMax||0,alertMaxAgeDays:settings.alertMaxAgeDays||0};
      const content=btoa(unescape(encodeURIComponent(JSON.stringify(body,null,2)+"\n")));
      const r=await fetch(url,{method:"PUT",headers:{Authorization:"token "+pat,"Content-Type":"application/json"},
        body:JSON.stringify({message:"chore: 설정 편집(폰)",content,sha:cur.sha})});
      if(r.ok){ note.textContent="✅ 저장됨. 다음 자동검색(최대 몇 시간)부터 적용됩니다"; }
      else{ const e=await r.json(); note.textContent="저장 실패: "+(e.message||r.status)+(r.status===401?" (토큰 확인)":""); if(r.status===401)localStorage.removeItem("gh_pat"); }
    }catch(e){ note.textContent="저장 실패: "+e.message; }
  }

  async function boot(){
    // 편집 버튼은 항상 표시(폰=GitHub 직접저장 / 맥=로컬서버)
    document.getElementById("gear").style.display="";
    try{ const s=await fetch("/api/settings"); if(s.ok){ settings=await s.json(); hasLocalApi=true; } }catch{}
    // 클라우드(6곳) + 로컬(시계거래소) 스냅샷을 합침
    const bust="?"+Date.now();
    const [cloud, local] = await Promise.all([
      fetch("./snapshot.json"+bust).then(r=>r.json()).catch(()=>({items:[]})),
      fetch("./snapshot.local.json"+bust).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})),
    ]);
    // 두 스냅샷 중 최신 시각을 마지막 업데이트로
    const cU=cloud.updatedAt?Date.parse(cloud.updatedAt):0, lU=local.updatedAt?Date.parse(local.updatedAt):0;
    const d = {
      ...cloud,
      items: [...(cloud.items||[]), ...(local.items||[])],
      sites: [...(cloud.sites||[]), ...(local.sites||[])],
      updatedAt: new Date(Math.max(cU,lU)||Date.now()).toISOString(),
    };
    all=d.items||[];
    if(!hasLocalApi){
      // 폰: 저장소의 실제 settings.json을 읽어 정확한 현재값 확보(편집용)
      settings = await fetch("https://raw.githubusercontent.com/"+REPO+"/main/settings.json"+bust)
        .then(r=>r.json())
        .catch(()=>({keywords:d.keywords||[],times:d.times||[],priceMin:d.priceMin||0,priceMax:d.priceMax||0,alertMaxAgeDays:d.alertMaxAgeDays||0}));
    }
    const t=new Date(d.updatedAt);
    const upd=t.toLocaleString("ko-KR",{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"});
    document.getElementById("meta").textContent=`매물 ${all.length}건`;
    document.getElementById("updated").textContent=`🕒 마지막 업데이트 ${upd}`;
    const pr = (d.priceMin||d.priceMax)
      ? `${(d.priceMin||0).toLocaleString()}~${d.priceMax?d.priceMax.toLocaleString():"제한없음"}만원`
      : "전체";
    document.getElementById("info").innerHTML =
      `🔍 <b>검색어</b> ${(d.keywords||[]).join(", ")||"-"}<br>` +
      `💰 <b>금액</b> ${pr}　⏰ <b>검색 시각</b> ${(d.times||[]).join(" · ")||"-"}<br>` +
      `🌐 <b>체크한 사이트</b> ${(d.sites||[]).join(" · ")||"-"}`;
    if (!canEdit) settings.priceMin=d.priceMin||0, settings.priceMax=d.priceMax||0;
    buildFilters(); render();
  }
  boot();
</script>
</body>
</html>
