<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>watch-alert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:#fcfcfb; --ink:#16181d; --sub:#8b9099; --line:#ebedf0; --card:#eef0f3;
    --blue:#274b86; --blue-ink:#1d3a68;
    --accent:var(--ink); --fg:var(--ink); --bg:var(--paper);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--paper); color:var(--ink); word-break:keep-all; letter-spacing:-.006em;
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .serif { font-family:'Instrument Serif',Georgia,serif; font-weight:400; letter-spacing:0; }
  .tnum { font-variant-numeric:tabular-nums; }

  header { position:sticky; top:0; background:color-mix(in srgb,var(--paper) 88%,transparent);
    backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line); z-index:5;
    padding:env(safe-area-inset-top) 0 0; }
  .hwrap { max-width:1040px; margin:0 auto; padding:14px 18px 10px; }
  .toprow { display:flex; align-items:baseline; gap:11px; }
  h1 { margin:0; font-size:2rem; line-height:.95; letter-spacing:.01em; color:var(--ink);
    font-family:'Instrument Serif',Georgia,serif; font-weight:400; }
  h1 .amp { color:var(--blue); font-style:italic; }
  .meta { color:var(--sub); font-size:.74rem; letter-spacing:0; }
  /* 라이브 데이트라인 */
  .updated { display:inline-flex; align-items:center; gap:6px; margin-top:6px; font-size:.72rem;
    color:var(--ink); font-weight:500; }
  .updated::before { content:''; width:5px; height:5px; border-radius:50%; background:var(--blue);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent); }
  /* 스펙 라인: 작은 대문자 라벨 + 값 */
  .info { margin-top:9px; display:grid; grid-template-columns:auto 1fr; gap:2px 12px; font-size:.75rem; align-items:baseline; }
  .info dt { color:var(--sub); font-size:.62rem; letter-spacing:.09em; text-transform:uppercase; white-space:nowrap; }
  .info dd { margin:0; color:var(--ink); }
  .gear { margin-left:auto; border:1px solid var(--line); background:var(--paper); border-radius:9px;
    font-size:.78rem; padding:6px 11px; cursor:pointer; color:var(--ink); font-family:inherit; }
  .gear:active { background:var(--card); }

  .row { display:flex; gap:6px; align-items:center; margin-top:11px; overflow-x:auto; padding-bottom:2px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; }
  .row::-webkit-scrollbar { display:none; }
  .row .lbl { flex:none; font-size:.6rem; color:var(--sub); letter-spacing:.1em; text-transform:uppercase; padding-right:2px; }
  .chip { flex:none; border:1px solid var(--line); background:var(--paper); border-radius:8px;
    padding:6px 11px; font-size:.79rem; cursor:pointer; color:var(--sub); white-space:nowrap;
    font-family:inherit; transition:color .12s,border-color .12s; }
  .chip .n { font-variant-numeric:tabular-nums; opacity:.6; margin-left:3px; }
  .chip.on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .chip.on .n { opacity:.55; }
  .chip.kw.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  select { flex:none; font-size:.79rem; border:1px solid var(--line); border-radius:8px; padding:6px 8px;
    background:var(--paper); color:var(--ink); font-family:inherit; }
  .pfin { flex:none; width:62px; font-size:16px; border:1px solid var(--line); border-radius:8px;
    padding:6px 8px; font-family:inherit; }
  /* 금액 듀얼 레인지 슬라이더 */
  #pricerow { overflow:visible; }
  .range { position:relative; flex:1; height:30px; min-width:150px; }
  .range-track { position:absolute; top:50%; left:0; right:0; height:3px; background:var(--line);
    border-radius:2px; transform:translateY(-50%); }
  .range-fill { position:absolute; top:50%; height:3px; background:var(--blue); border-radius:2px;
    transform:translateY(-50%); }
  .range input[type=range] { position:absolute; top:0; left:0; width:100%; height:30px; margin:0;
    -webkit-appearance:none; appearance:none; background:none; pointer-events:none; }
  .range input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px;
    border-radius:50%; background:#fff; border:1.5px solid var(--blue);
    box-shadow:0 1px 4px color-mix(in srgb,var(--blue) 35%,transparent); pointer-events:auto; cursor:pointer; }
  .range input[type=range]::-moz-range-thumb { width:18px; height:18px; border-radius:50%; background:#fff;
    border:1.5px solid var(--blue); box-shadow:0 1px 4px rgba(39,75,134,.35); pointer-events:auto; cursor:pointer; }
  .rangeval { flex:none; font-size:.8rem; color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap; min-width:118px; }
  .rangeval b { font-weight:600; }

  main { max-width:1040px; margin:0 auto; padding:16px 18px 72px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:22px 14px; }
  .card { display:flex; flex-direction:column; text-decoration:none; color:inherit; }
  .ph { position:relative; width:100%; aspect-ratio:1/1; background:var(--card); border-radius:10px;
    overflow:hidden; box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 5%,transparent); }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .card:active .ph img { transform:scale(.98); }
  .ph img { transition:transform .2s ease; }
  .new { position:absolute; left:8px; top:8px; background:var(--blue); color:#fff;
    font-size:.58rem; font-weight:700; letter-spacing:.08em; padding:3px 7px; border-radius:5px; }
  /* 사이트 = 이미지 아래 작은 대문자 캡션 */
  .badge { order:1; margin:9px 1px 0; font-size:.6rem; letter-spacing:.09em; text-transform:uppercase;
    color:var(--sub); }
  .title { order:2; font-size:.85rem; line-height:1.38; margin:3px 1px 0; color:var(--ink); font-weight:500;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .kwtag { order:4; font-size:.66rem; color:var(--sub); margin:5px 1px 0; }
  .price { order:3; font-size:1rem; font-weight:600; margin:6px 1px 0; color:var(--ink);
    font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .price .ask { font-weight:500; color:var(--sub); font-size:.85rem; }
  .price .age { font-weight:400; color:var(--sub); font-size:.72rem; letter-spacing:0; }
  .empty { color:var(--sub); text-align:center; padding:72px 0; font-size:.85rem; }

  .section-h { font-size:.72rem; font-weight:600; letter-spacing:.08em; text-transform:uppercase;
    color:var(--sub); margin:34px 1px 14px; padding-top:16px; border-top:1px solid var(--line);
    display:flex; align-items:baseline; gap:8px; }
  .section-h .sub { font-weight:500; color:var(--sub); font-size:.7rem; text-transform:none; letter-spacing:0; }

  .price-inputs { display:flex; align-items:center; gap:6px; margin-bottom:14px; }
  .price-inputs input { width:90px; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:8px; font-family:inherit; }
  .price-inputs span { color:var(--sub); font-size:.85rem; }
  /* 편집 패널 */
  .panel { display:none; border-top:1px solid var(--line); margin-top:12px; padding-top:14px; }
  .panel.open { display:block; }
  .panel h3 { font-size:.64rem; color:var(--sub); margin:0 0 8px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; }
  .edit-list { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:9px; }
  .edit-chip { display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:6px 8px 6px 12px; font-size:.82rem; }
  .edit-chip button { border:none; background:none; color:var(--sub); cursor:pointer; font-size:1.05rem; line-height:1; padding:0; }
  .addbar { display:flex; gap:7px; margin-bottom:16px; }
  .addbar input { flex:1; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:9px 11px; min-width:0; font-family:inherit; }
  .addbar button, .saveBtn { border:none; background:var(--ink); color:var(--paper); border-radius:8px; padding:10px 15px; font-size:.85rem; cursor:pointer; font-family:inherit; font-weight:500; }
  .times input { width:74px; font-size:16px; border:1px solid var(--line); border-radius:8px; padding:8px; margin-right:6px; font-family:inherit; }
  .savenote { font-size:.72rem; color:var(--sub); margin-top:9px; line-height:1.6; }
  .savenote a { color:var(--blue); }
  /* 실시간 검색 바 */
  .searchbar { display:flex; gap:8px; margin-top:11px; }
  .searchbar input { flex:1; font-size:16px; border:1px solid var(--line); border-radius:9px;
    padding:9px 12px; min-width:0; font-family:inherit; background:var(--paper); color:var(--ink); }
  .searchbar input:focus { outline:none; border-color:var(--blue); }
  .searchbar button { flex:none; border:none; background:var(--blue); color:#fff; border-radius:9px;
    padding:9px 16px; font-size:.85rem; font-weight:600; cursor:pointer; font-family:inherit; }
  .qnote { font-size:.73rem; margin-top:8px; color:var(--sub); display:none; }
  .qnote.show { display:block; }
  .qnote .x { color:var(--blue); cursor:pointer; text-decoration:underline; margin-left:6px; }
  .qnote b { color:var(--ink); font-weight:600; }
  .chip.saved { display:inline-flex; align-items:center; gap:2px; }
  .chip.saved.on { background:var(--blue); border-color:var(--blue); color:#fff; }
  .chip .delx { border:none; background:none; color:inherit; opacity:.5; cursor:pointer; font-size:1rem;
    line-height:1; padding:0 0 0 4px; margin:0; font-family:inherit; }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="toprow">
      <h1>watch<span class="amp">·</span>alert</h1>
      <span class="meta" id="meta">불러오는 중…</span>
      <button class="gear" id="gear" style="display:none" onclick="togglePanel()">편집</button>
    </div>
    <div class="updated" id="updated"></div>
    <div class="searchbar">
      <input id="q" enterkeyhint="search" placeholder="시계 실시간 검색 (예: 롤렉스 서브마리너)">
      <button id="qbtn" onclick="liveSearch()">검색</button>
    </div>
    <div class="qnote" id="qnote"></div>
    <div class="row" id="savedrow"></div>
    <dl class="info" id="info"></dl>
    <div class="row" id="kwrow"></div>
    <div class="row" id="siterow"></div>
    <div class="row" id="pricerow"></div>
    <div class="panel" id="panel">
      <h3>검색어 (여러 개 추가 가능 · 저장 시 클라우드에도 반영)</h3>
      <div class="edit-list" id="kwEdit"></div>
      <div class="addbar">
        <input id="kwInput" placeholder="검색어 추가 (예: 롤렉스 서브마리너)">
        <button onclick="addKw()">추가</button>
      </div>
      <h3>금액 범위 (만원 · 0 = 제한 없음)</h3>
      <div class="price-inputs">
        <input type="number" id="pMin" placeholder="최소" min="0"><span>만원 ~</span>
        <input type="number" id="pMax" placeholder="최대" min="0"><span>만원</span>
      </div>
      <h3>알림 기준 (며칠 이내 등록된 새 매물만 알림 · 0=제한없음)</h3>
      <div class="price-inputs"><input type="number" id="aAge" min="0"><span>일 이내</span></div>
      <h3>검색 시각 (하루 3회 · 시각 변경은 맥에서만 적용됨)</h3>
      <div class="times" id="timesEdit"></div>
      <div style="margin-top:12px"><button class="saveBtn" onclick="save()">💾 저장하고 적용</button>
        <span class="savenote" id="saveNote"></span></div>
      <div class="savenote" id="patHelp" style="display:none;margin-top:10px;line-height:1.6"></div>
    </div>
  </div>
</header>
<main>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">매물이 없습니다.</div>
  <div id="askSection" style="display:none">
    <div class="section-h">💬 가격문의 <span id="askCount" class="sub"></span></div>
    <div class="grid" id="askGrid"></div>
  </div>
</main>
<script>
  const SITE_ORDER = ["시계거래소","바이버","번개장터","중고나라","캉카스","필웨이","타임포럼","구구스"];
  let all=[], site="전체", sort="new", kwActive=new Set(), settings={keywords:[],times:[],priceMin:0,priceMax:0,alertMaxAgeDays:0}, hasLocalApi=false;
  let snapAll=[], liveResults=null; // 모아둔 스냅샷 백업 / 실시간 검색 결과
  let viewMin=0, viewMax=0; // 화면 즉시 금액필터(만원). 설정과 별개, 저장 불필요.
  const PMAX=10000; // 슬라이더 상한 1억(만원). 이 값이면 '제한없음'(그 이상 전부 포함).
  const fmtMan = v => v>=10000 ? (v/10000).toLocaleString(undefined,{maximumFractionDigits:1})+"억" : v.toLocaleString()+"만";
  const cardHtml = (i) => `
    <a class="card" href="${i.url}" target="_blank" rel="noopener">
      <div class="ph">
        ${i.image?`<img loading="lazy" src="${i.image}" alt="" onerror="this.style.display='none'">`:""}
        ${i.isNew?`<span class="new">NEW</span>`:""}
      </div>
      <div class="badge">${i.site}</div>
      <div class="title">${i.title}</div>
      <div class="price">${i.price?won(i.price):'<span class="ask">가격문의</span>'}${i.date?`<span class="age"> · ${ageLabel(i.date)}</span>`:""}</div>
      ${i.keyword?`<div class="kwtag">🔍 ${i.keyword}</div>`:""}
    </a>`;
  const won = (n) => n ? (n>=10000 ? Math.round(n/10000).toLocaleString()+"만원" : n.toLocaleString()+"원") : null;
  const toMs = (v) => v==null ? null : (typeof v==="number" ? (v<1e12?v*1000:v) : Date.parse(String(v).replace(" ","T"))||null);
  function ageLabel(v){ const ms=toMs(v); if(!ms) return ""; const d=Math.floor((Date.now()-ms)/86400000);
    return d<=0?"오늘":d===1?"어제":d+"일 전"; }

  function render() {
    let list = site==="전체" ? all : all.filter(i=>i.site===site);
    if (kwActive.size) list = list.filter(i => kwActive.has(i.keyword));
    // 가격문의(가격 없음)는 따로 분리
    let priced = list.filter(i=>i.price);
    const asks = list.filter(i=>!i.price);
    // 금액 즉시필터(만원 → 원). max=0 이면 상한 없음. 재검색 없이 화면에서 바로 거름.
    const min=(viewMin||0)*10000, max=(viewMax||0)*10000;
    if (min>0 || max>0) priced = priced.filter(i=>i.price>=min && (max===0 || i.price<=max));

    const sortFn = (arr)=>{
      if (sort==="priceUp") return [...arr].sort((a,b)=>a.price-b.price);
      if (sort==="priceDown") return [...arr].sort((a,b)=>b.price-a.price);
      if (sort==="new") return [...arr].sort((a,b)=>(b.isNew?1:0)-(a.isNew?1:0) || (toMs(b.date)||0)-(toMs(a.date)||0));
      return [...arr].sort((a,b)=>SITE_ORDER.indexOf(a.site)-SITE_ORDER.indexOf(b.site));
    };
    document.getElementById("empty").style.display = (priced.length||asks.length)?"none":"block";
    document.getElementById("grid").innerHTML = sortFn(priced).map(cardHtml).join("");
    document.getElementById("askSection").style.display = asks.length?"block":"none";
    document.getElementById("askCount").textContent = asks.length?`${asks.length}건`:"";
    document.getElementById("askGrid").innerHTML = sortFn(asks).map(cardHtml).join("");
  }

  function buildFilters() {
    const counts={}; all.forEach(i=>counts[i.site]=(counts[i.site]||0)+1);
    const sites=["전체",...SITE_ORDER.filter(s=>counts[s])];
    document.getElementById("siterow").innerHTML =
      `<span class="lbl">사이트</span>` +
      sites.map(s=>`<span class="chip site${s===site?' on':''}" data-s="${s}">${s}${s!=="전체"?` ${counts[s]}`:` ${all.length}`}</span>`).join("") +
      `<select id="sort">
         <option value="new">최신순</option><option value="site">사이트순</option>
         <option value="priceUp">가격↑</option><option value="priceDown">가격↓</option>
       </select>`;
    document.querySelectorAll(".chip.site").forEach(el=>el.onclick=()=>{site=el.dataset.s;buildFilters();render();});
    document.getElementById("sort").value=sort;
    document.getElementById("sort").onchange=e=>{sort=e.target.value;render();};

    // 키워드 필터(여러 개 선택 가능)
    const kc={}; all.forEach(i=>i.keyword&&(kc[i.keyword]=(kc[i.keyword]||0)+1));
    const kws=Object.keys(kc);
    document.getElementById("kwrow").innerHTML = kws.length>1 || kwActive.size ?
      `<span class="lbl">검색어</span>` +
      kws.map(k=>`<span class="chip kw${kwActive.has(k)?' on':''}" data-k="${k}">${k} ${kc[k]}</span>`).join("") : "";
    document.querySelectorAll(".chip.kw").forEach(el=>el.onclick=()=>{
      const k=el.dataset.k; kwActive.has(k)?kwActive.delete(k):kwActive.add(k); buildFilters(); render();
    });

    // 금액 듀얼 슬라이더(드래그로 min/max). 재검색·저장 없이 즉시. PMAX=제한없음.
    const lo0=Math.min(viewMin||0,PMAX), hi0=viewMax?Math.min(viewMax,PMAX):PMAX;
    document.getElementById("pricerow").innerHTML =
      `<span class="lbl">금액</span>` +
      `<div class="range">
         <div class="range-track"></div>
         <div class="range-fill" id="rfill"></div>
         <input type="range" id="rMin" min="0" max="${PMAX}" step="100" value="${lo0}">
         <input type="range" id="rMax" min="0" max="${PMAX}" step="100" value="${hi0}">
       </div>
       <div class="rangeval" id="rval"></div>`;
    const rMin=document.getElementById("rMin"), rMax=document.getElementById("rMax"),
          rfill=document.getElementById("rfill"), rval=document.getElementById("rval");
    const sync=(doRender)=>{
      let lo=+rMin.value, hi=+rMax.value;
      if(lo>hi-100){ if(document.activeElement===rMin) lo=Math.max(0,hi-100); else hi=Math.min(PMAX,lo+100); rMin.value=lo; rMax.value=hi; }
      const pL=lo/PMAX*100, pH=hi/PMAX*100;
      rfill.style.left=pL+"%"; rfill.style.right=(100-pH)+"%";
      viewMin=lo; viewMax=(hi>=PMAX?0:hi);
      rval.innerHTML=`<b>${lo?fmtMan(lo):"0"}</b> ~ <b>${hi>=PMAX?"제한없음":fmtMan(hi)}</b>`;
      if(doRender) render();
    };
    rMin.oninput=()=>sync(true); rMax.oninput=()=>sync(true);
    sync(false);
  }

  // ===== 실시간 검색 =====
  const qnote=()=>document.getElementById("qnote");
  let curQ=null; // 방금 검색한 키워드(저장용)
  let saved=[]; try{ saved=JSON.parse(localStorage.getItem("savedSearches")||"[]"); }catch{}

  async function liveSearch(){
    const kw=document.getElementById("q").value.trim(); if(!kw) return;
    if(!hasLocalApi){
      qnote().className="qnote show";
      qnote().innerHTML="📱 실시간 웹 검색은 <b>맥(localhost:5178)</b>에서만 됩니다. 폰은 브라우저 보안(CORS)·렌더링 제약으로 불가. 아래는 모아둔 결과에서 '"+kw+"' 필터 결과입니다.";
      all=snapAll.filter(i=>(i.title||"").toLowerCase().includes(kw.toLowerCase())); buildFilters(); render(); return;
    }
    const btn=document.getElementById("qbtn"); btn.textContent="검색중"; btn.disabled=true;
    qnote().className="qnote show"; qnote().innerHTML=`<b>'${kw}'</b> 전 사이트 실시간 조사 중… (수십 초 소요)`;
    try{
      const r=await fetch("/api/search?keyword="+encodeURIComponent(kw));
      const j=await r.json();
      liveResults=j.items||[]; all=liveResults; site="전체"; kwActive.clear(); curQ=kw;
      buildFilters(); render();
      showResultNote();
    }catch(e){ qnote().innerHTML="검색 실패: "+e.message+' <span class="x" onclick="closeSearch()">닫기</span>'; }
    btn.textContent="검색"; btn.disabled=false;
  }
  function showResultNote(){
    const isSaved = saved.some(s=>s.q===curQ);
    qnote().className="qnote show";
    qnote().innerHTML=`<b>'${curQ}'</b> 검색 결과 ${liveResults.length}건 `+
      (isSaved?`<span class="x" onclick="unsaveCurrent()">★ 저장됨(해제)</span>`:`<span class="x" onclick="saveCurrent()">☆ 이 검색 저장</span>`)+
      ` <span class="x" onclick="closeSearch()">닫기 ✕</span>`;
  }
  function persistSaved(){ localStorage.setItem("savedSearches",JSON.stringify(saved.slice(0,20))); renderSaved(); }
  function saveCurrent(){ if(!curQ||!liveResults)return;
    saved=saved.filter(s=>s.q!==curQ);
    saved.unshift({q:curQ, ts:Date.now(), items:liveResults});
    persistSaved(); showResultNote(); }
  function unsaveCurrent(){ saved=saved.filter(s=>s.q!==curQ); persistSaved(); showResultNote(); }
  function openSaved(i){ const s=saved[i]; if(!s)return;
    liveResults=s.items; all=s.items; curQ=s.q; site="전체"; kwActive.clear();
    document.getElementById("q").value=s.q; buildFilters(); render(); showResultNote(); renderSaved();
    window.scrollTo({top:0,behavior:"smooth"}); }
  function delSaved(i,ev){ ev&&ev.stopPropagation(); saved.splice(i,1); persistSaved(); }
  function renderSaved(){
    const el=document.getElementById("savedrow");
    if(!saved.length){ el.innerHTML=""; return; }
    el.innerHTML=`<span class="lbl">저장검색</span>`+
      saved.map((s,i)=>`<span class="chip saved${curQ===s.q&&liveResults?' on':''}" onclick="openSaved(${i})">${s.q} <span class="n">${(s.items||[]).length}</span><button class="delx" onclick="delSaved(${i},event)">×</button></span>`).join("");
  }
  function closeSearch(){ liveResults=null; all=snapAll; curQ=null; document.getElementById("q").value="";
    qnote().className="qnote"; buildFilters(); render(); renderSaved(); }

  // ===== 편집 패널 =====
  function togglePanel(){ document.getElementById("panel").classList.toggle("open"); renderPanel(); }
  function renderPanel(){
    document.getElementById("kwEdit").innerHTML = settings.keywords.map((k,idx)=>
      `<span class="edit-chip">${k}<button onclick="delKw(${idx})">×</button></span>`).join("") || '<span class="savenote">검색어가 없습니다</span>';
    document.getElementById("timesEdit").innerHTML = (settings.times||[]).map((t,idx)=>
      `<input type="time" value="${t}" onchange="settings.times[${idx}]=this.value">`).join("");
    document.getElementById("pMin").value = settings.priceMin||"";
    document.getElementById("pMax").value = settings.priceMax||"";
    document.getElementById("pMin").onchange = e=>settings.priceMin=Number(e.target.value)||0;
    document.getElementById("pMax").onchange = e=>settings.priceMax=Number(e.target.value)||0;
    const aa=document.getElementById("aAge"); aa.value=settings.alertMaxAgeDays||""; aa.onchange=e=>settings.alertMaxAgeDays=Number(e.target.value)||0;
    // 폰(로컬서버 없음)이면 GitHub 토큰 안내 표시
    const ph=document.getElementById("patHelp");
    if(!hasLocalApi && !localStorage.getItem("gh_pat")){
      ph.style.display="block";
      ph.innerHTML="📱 폰에서 저장하려면 GitHub 토큰이 한 번 필요합니다:<br>"+
        "1) <a href='https://github.com/settings/tokens/new?scopes=repo&description=watch-alert' target='_blank'>여기서 토큰 생성</a> (repo 권한, 만료 no expiration)<br>"+
        "2) 생성된 토큰 복사 → 저장 누르면 입력창에 붙여넣기 (폰에 1회 저장됨)";
    } else ph.style.display="none";
  }
  function addKw(){ const v=document.getElementById("kwInput").value.trim(); if(!v)return;
    if(!settings.keywords.includes(v))settings.keywords.push(v); document.getElementById("kwInput").value=""; renderPanel(); }
  function delKw(i){ settings.keywords.splice(i,1); renderPanel(); }
  const REPO="chanbap24-create/watch-alert";
  async function save(){
    const note=document.getElementById("saveNote"); note.textContent="저장 중…";
    // 1) 맥 로컬 서버가 있으면 그쪽으로(스케줄까지 갱신)
    if (hasLocalApi){
      try{
        const r=await fetch("/api/settings",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(settings)});
        const j=await r.json();
        note.textContent = j.ok ? "✅ 저장됨. 다음 검색부터 적용" + (j.pushed?" (클라우드 반영)":"") : "저장 실패: "+(j.error||"");
        return;
      }catch(e){}
    }
    // 2) 폰/외부: GitHub에 직접 커밋(토큰 필요)
    let pat=localStorage.getItem("gh_pat");
    if(!pat){ pat=prompt("GitHub 토큰을 입력하세요 (한 번만). 만드는 법은 아래 안내 참고:"); if(!pat){note.textContent="취소됨";return;} localStorage.setItem("gh_pat",pat.trim()); }
    try{
      const url=`https://api.github.com/repos/${REPO}/contents/settings.json`;
      const cur=await fetch(url,{headers:{Authorization:"token "+pat}}).then(r=>r.json());
      const body={keywords:settings.keywords,times:settings.times,priceMin:settings.priceMin||0,priceMax:settings.priceMax||0,alertMaxAgeDays:settings.alertMaxAgeDays||0};
      const content=btoa(unescape(encodeURIComponent(JSON.stringify(body,null,2)+"\n")));
      const r=await fetch(url,{method:"PUT",headers:{Authorization:"token "+pat,"Content-Type":"application/json"},
        body:JSON.stringify({message:"chore: 설정 편집(폰)",content,sha:cur.sha})});
      if(r.ok){ note.textContent="✅ 저장됨. 다음 자동검색(최대 몇 시간)부터 적용됩니다"; }
      else{ const e=await r.json(); note.textContent="저장 실패: "+(e.message||r.status)+(r.status===401?" (토큰 확인)":""); if(r.status===401)localStorage.removeItem("gh_pat"); }
    }catch(e){ note.textContent="저장 실패: "+e.message; }
  }

  async function boot(){
    // 편집 버튼은 항상 표시(폰=GitHub 직접저장 / 맥=로컬서버)
    document.getElementById("gear").style.display="";
    try{ const s=await fetch("/api/settings"); if(s.ok){ settings=await s.json(); hasLocalApi=true; } }catch{}
    // 클라우드(6곳) + 로컬(시계거래소) 스냅샷을 합침
    const bust="?"+Date.now();
    const [cloud, local] = await Promise.all([
      fetch("./snapshot.json"+bust).then(r=>r.json()).catch(()=>({items:[]})),
      fetch("./snapshot.local.json"+bust).then(r=>r.ok?r.json():{items:[]}).catch(()=>({items:[]})),
    ]);
    // 두 스냅샷 중 최신 시각을 마지막 업데이트로
    const cU=cloud.updatedAt?Date.parse(cloud.updatedAt):0, lU=local.updatedAt?Date.parse(local.updatedAt):0;
    const d = {
      ...cloud,
      items: [...(cloud.items||[]), ...(local.items||[])],
      sites: [...(cloud.sites||[]), ...(local.sites||[])],
      updatedAt: new Date(Math.max(cU,lU)||Date.now()).toISOString(),
    };
    all=d.items||[]; snapAll=all;
    document.getElementById("q").addEventListener("keydown",e=>{if(e.key==="Enter")liveSearch();});
    // 화면 금액필터 초기값 = 설정값(있으면). 이후 화면에서 즉시 조절 가능(저장 불필요).
    viewMin=d.priceMin||0; viewMax=d.priceMax||0;
    if(!hasLocalApi){
      // 폰: 저장소의 실제 settings.json을 읽어 정확한 현재값 확보(편집용)
      settings = await fetch("https://raw.githubusercontent.com/"+REPO+"/main/settings.json"+bust)
        .then(r=>r.json())
        .catch(()=>({keywords:d.keywords||[],times:d.times||[],priceMin:d.priceMin||0,priceMax:d.priceMax||0,alertMaxAgeDays:d.alertMaxAgeDays||0}));
    }
    const t=new Date(d.updatedAt);
    const upd=t.toLocaleString("ko-KR",{month:"long",day:"numeric",hour:"2-digit",minute:"2-digit"});
    document.getElementById("meta").textContent=`${all.length}점`;
    document.getElementById("updated").textContent=`업데이트 ${upd}`;
    const pr = (d.priceMin||d.priceMax)
      ? `${(d.priceMin||0).toLocaleString()}–${d.priceMax?d.priceMax.toLocaleString():"제한없음"}만원`
      : "전체";
    const row=(k,v)=>`<dt>${k}</dt><dd>${v||"-"}</dd>`;
    document.getElementById("info").innerHTML =
      row("검색", (d.keywords||[]).join(", ")) +
      row("알림가", pr) +
      row("검색시각", (d.times||[]).join(" · ")) +
      row("사이트", (d.sites||[]).join(" · "));
    buildFilters(); render(); renderSaved();
  }
  boot();
</script>
</body>
</html>
