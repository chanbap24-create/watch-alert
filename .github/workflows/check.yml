name: watch-check

# 하루 3회(KST 09시/15시/21시 = UTC 0/6/12). GitHub Actions는 UTC 기준.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {} # 수동 실행 버튼

# seen.json을 커밋해 실행 간 상태를 유지하기 위한 권한
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: watch-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js

      - name: Persist seen list
        run: |
          git config user.name "watch-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/seen.json
          git commit -m "chore: update seen list [skip ci]" || echo "변경 없음"
          git push || echo "push 생략"
