name: watch-check

# 하루 3회(KST 09/15/21시 = UTC 0/6/12). 로그인 불필요 6곳만 클라우드에서 검색.
on:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: watch-check
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # 중고나라(chromium) + 구구스(real chrome) 둘 다 설치
      - run: npx playwright install --with-deps chromium chrome

      - name: Run check (cloud sites)
        env:
          CONFIG: config.cloud.json
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node index.js

      - name: Persist seen + snapshot
        run: |
          git config user.name "watch-alert-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/seen.json docs/snapshot.json
          git commit -m "chore: cloud check $(date -u '+%Y-%m-%d %H:%M')" || echo "변경 없음"
          git push || echo "push 생략"
